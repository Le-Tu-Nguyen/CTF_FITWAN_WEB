{% extends 'base.html' %}{% block content %}
<section class="panel auth">
    <p class="eyebrow">CTF FITWAN / TÀI KHOẢN</p>
    <h1>{{ 'Đăng ký' if register else 'Đăng nhập' }}</h1>
    <form method="post">
        <input type="hidden" name="csrf" value="{{ csrf() }}">
        <label>Tên tài khoản<input name="username" required minlength="3" maxlength="24" autocomplete="username" pattern="[A-Za-z0-9_]{3,24}"></label>
        <label>Mật khẩu<input name="password" type="password" required minlength="{{ 10 if register else 1 }}" maxlength="128" autocomplete="{{ 'new-password' if register else 'current-password' }}"></label>
        <button>{{ 'Tạo tài khoản' if register else 'Vào đấu trường' }}</button>
    </form>
    <p><a href="{{ url_for('login' if register else 'register') }}">{{ 'Đã có tài khoản? Đăng nhập' if register else 'Chưa có tài khoản? Đăng ký' }}</a></p>
</section>{% endblock %}
